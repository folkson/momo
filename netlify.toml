# Netlify 部署配置
#
# ## 为什么需要 base = "app"
#
# 这个仓库不是一个纯前端项目，根目录还有一套独立的 Node 同步工具
# （src/、test/、testkit/，零依赖、跑 `node --test`）。真正的前端在 app/ 里。
#
# Netlify 默认在仓库根目录找 package.json 装依赖、跑构建 —— 那样会装错东西
# （根 package.json 没有 devDependencies，也没有 vite）。所以必须把构建
# 目录指到 app/。
#
# ⚠️ publish 是**相对于 base** 解析的（Netlify 官方行为）：
#      base = "app"  +  publish = "dist"   →   实际部署 app/dist
#    如果写成 publish = "app/dist"，会变成 app/app/dist，直接部署失败报
#    "publish directory not found"。

[build]
base = "app"
command = "npm run build"
publish = "dist"

# ── Node 版本 ──
#
# 依赖树里有一条**硬约束**决定了下限：html2canvas-pro@2.5.2 要求 node >=24.0.0
# （它被 Share.svelte 用于生成分享图，是运行时依赖，不只是构建期）。
# 另外 postcss-calc@11.2.3（cssnano 的传递依赖）要求 ^22.22.3 || ^24.15。
#
# 所以钉在 22 是不够的：本地之所以能跑，只是因为 npm 的 engine-strict 默认
# false，EBADENGINE 只是警告。换个环境（或将来 Netlify 打开严格校验）就会挂。
# 这里直接选 24 —— 两个约束都满足，且是当前 LTS。
#
# 写主版本号 "24" 即可，Netlify 会解析为 24.x 的最新版（官方文档：
# "set a major version, such as the number 24 for the latest version of 24.x"）。
[build.environment]
NODE_VERSION = "24"

# ── SPA 回退 ──
#
# 如实说明：这个应用**当前并不使用路径路由**。页面切换靠 Svelte store
# （currentPage）在内存里完成，URL 从头到尾不变，index.html 只在首次加载时
# 请求一次。所以严格来说这条规则现在用不上。
#
# 留着它的两个理由：
#   1. 以后若改成真正的路径路由（/setting、/daily…），不用再想起来补配置；
#   2. 用户手输 /app/whatever 这类地址时不会看到 Netlify 的 404 页。
#
# 关于 PWA 的安全性：Netlify 默认**不会 shadow 已存在的静态文件**
# （官方文档的 "Shadowing" 一节），所以这条 splat 规则不会吞掉
# /sw.js、/manifest.webmanifest、/assets/*。这里刻意不加 `!` 强制后缀 ——
# 加了才会让 sw.js 也被 rewrite 成 index.html，那样 Service Worker 就废了。
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# ── 缓存策略 ──
#
# Vite 给 assets/ 下的文件带内容 hash，可以长缓存；但下面这些文件名固定，
# 必须短缓存，否则用户会一直拿到旧的 Service Worker / 旧的 HTML。
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# ── 基础安全头 ──
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
Referrer-Policy = "strict-origin-when-cross-origin"
